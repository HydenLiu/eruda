<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Network</title>
    <link rel="stylesheet" href="lib/jasmine.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="lib/jquery.js"></script>
    <script src="lib/jasmine.js"></script>
    <script src="lib/jasmine-html.js"></script>
    <script src="assets/eruda.js"></script>
    <script src="boot.js"></script>
    <script src="util.js"></script>
  </head>
  <body>
    <header>Network</header>
    <nav>
      <ul>
        <li>
          <a href="#" id="post-json">POST JSON</a>
        </li>
        <li>
          <a href="#" id="post-form">POST Form</a>
        </li>
        <li>
          <a href="#" id="post-text">POST Text</a>
        </li>
      </ul>
    </nav>
    <script>
      function sendPost(contentType, body) {
        return fetch(location.href, {
          method: 'POST',
          headers: { 'Content-Type': contentType },
          body: body,
        }).catch(function () {})
      }

      function addClick(id, fn) {
        document.getElementById(id).addEventListener(
          'click',
          function (e) {
            e.preventDefault()
            fn()
          },
          false
        )
      }

      addClick('post-json', function () {
        sendPost(
          'application/json',
          JSON.stringify({ foo: 1, bar: 'hello', nested: { ok: true } })
        )
      })
      addClick('post-form', function () {
        sendPost('application/x-www-form-urlencoded', 'foo=1&bar=hello')
      })
      addClick('post-text', function () {
        sendPost('text/plain', 'plain request body')
      })

      boot('network', function () {
        eruda.add(new eruda.Sources())
        sendPost(
          'application/json',
          JSON.stringify({ foo: 1, bar: 'hello', nested: { ok: true } })
        )
      })
    </script>
  </body>
</html>
